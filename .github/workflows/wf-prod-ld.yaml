name: wf-release-lbu
on:
  pull_request:
    branches:
      - prod  
  push:
    branches:
      - prod
  workflow_dispatch: 
jobs:
  prod-lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: chekcout repository
        uses: actions/checkout@v4
      - name: Lint HTML and Stylelint
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
      - name: Build With Parcel
        run: |
          npx parcel build "./src/index.html"
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          name: prod-artifact
          path: "./release"
  prod-dep-job:
    needs: prod-lint-job
    environment: staging
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Upload To Staging Environment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: prod-artifact
          token: ${{github.token}}
